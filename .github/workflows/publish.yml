name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build distributions
    # Only run the Python/packaging/release pipeline on version tags; a manual
    # dispatch should just build the Windows EXE.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install build twine

      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          if not tag.startswith("v"):
              raise SystemExit(f"Expected a v-prefixed release tag, got {tag!r}")

          tag_version = tag[1:]
          with Path("pyproject.toml").open("rb") as pyproject:
              package_version = tomllib.load(pyproject)["project"]["version"]

          if tag_version != package_version:
              raise SystemExit(
                  f"Release tag {tag!r} does not match pyproject.toml version "
                  f"{package_version!r}"
              )
          PY

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  github-release:
    name: Create GitHub Release
    needs: publish-testpypi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Create release and upload distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi

  publish-pypi:
    name: Publish to PyPI
    needs: github-release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  build-windows-exe:
    name: Build FlowChemQt standalone EXE
    # Independent job so a manual dispatch builds the EXE without the release
    # pipeline. On tag runs the release-attach step waits for the release
    # created by the pipeline above before uploading.
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . nuitka

      # Derive the package version from pyproject.toml so the EXE's file
      # metadata always matches the current release instead of a hardcoded value.
      - name: Read package version
        id: version
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT

      # Mirror the tag/version consistency check from the packaging pipeline so
      # a release-tag build never ships an EXE whose version does not match the tag.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          tag_version = tag[1:]
          with Path("pyproject.toml").open("rb") as pyproject:
              package_version = tomllib.load(pyproject)["project"]["version"]

          if tag_version != package_version:
              raise SystemExit(
                  f"Release tag {tag!r} does not match pyproject.toml version "
                  f"{package_version!r}"
              )
          PY

      - name: Build standalone EXE with Nuitka
        run: |
          python -m nuitka `
            --standalone `
            --jobs=8 `
            --msvc=latest `
            --lto=yes `
            --onefile `
            --enable-plugin=pyqt5 `
            --windows-console-mode=disable `
            --windows-icon-from-ico="resources\icons\flowchem_app_icon.ico" `
            --output-filename="FlowChemQt" `
            --include-package=app `
            --include-package=qfluentwidgets `
            --include-data-dir="resources=resources" `
            --output-dir=dist `
            --company-name="FlowChem" `
            --product-name="FlowChem Manager" `
            --file-version="${{ steps.version.outputs.version }}" `
            main.py

      - name: Verify EXE exists
        run: |
          if (-not (Test-Path "dist\FlowChemQt.exe")) {
            Write-Error "Build failed: dist\FlowChemQt.exe not found"
            exit 1
          }

      # Always upload the built EXE so a manual run is downloadable from the run.
      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowChemQt-windows
          path: dist/FlowChemQt.exe
          if-no-files-found: error

      # On a tag push, attach the EXE to the release. Wait for the release
      # created by the packaging pipeline (it only exists after the python
      # distributions are built) before uploading, to avoid a create race.
      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          for ($i = 0; $i -lt 30; $i++) {
            if (gh release view $tag > $null 2>&1) {
              gh release upload $tag "dist\FlowChemQt.exe" --clobber
              exit 0
            }
            Start-Sleep -Seconds 10
          }
          Write-Error "Release $tag was not created in time by the packaging pipeline"
          exit 1
