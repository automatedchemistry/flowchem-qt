[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowchem-qt"
version = "0.0.7"
requires-python = ">=3.11"
dependencies = [
    "flowchem",
    "PySide6>=6.5",
    "PySide6-Fluent-Widgets>=1.11.2",
    "tomli-w>=1.0",
    "loguru>=0.7",
    "zeroconf>=0.149.7",
    "click>=8.3.3",
]

[project.optional-dependencies]
test = ["pytest"]

[project.gui-scripts]
flowchem-qt = "main:main"

[tool.uv]
# flowchem pins old numpy/pandas that no longer build on Python 3.12+;
# force modern wheels instead of source builds.
constraint-dependencies = ["numpy>=2.1", "pandas>=2.2"]

[tool.setuptools]
py-modules = ["main"]
packages = ["app", "app.tabs", "resources", "resources.icons"]

[tool.setuptools.package-data]
"resources.icons" = ["*.ico", "*.svg"]
