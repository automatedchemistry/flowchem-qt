[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowchem-qt"
version = "0.0.7"
requires-python = ">=3.11, <3.14"
dependencies = [
    "flowchem>=1.1",
    "PyQt5 ~= 5.15.11",
    "pyqt5-qt5==5.15.2; sys_platform == 'win32'",
    "PyQt-Fluent-Widgets>=1.11.2",
    "tomli-w>=1.0",
    "loguru>=0.7",
    "zeroconf>=0.149.7",
    "click",
    "nuitka>=4.3.5",
]

[project.optional-dependencies]
test = ["pytest"]

[project.gui-scripts]
flowchem-qt = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["app", "app.tabs", "resources", "resources.icons"]

[tool.setuptools.package-data]
"resources.icons" = ["*.ico", "*.svg"]
